# XcodeGen spec — CI runs `xcodegen generate` to produce OmertaAI.xcodeproj,
# then `xcodebuild` archives an (unsigned) IPA. Keeps a hand-editable source of truth
# instead of a binary .xcodeproj.
name: OmertaAI
options:
  bundleIdPrefix: ai.omerta
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
targets:
  OmertaAI:
    type: application
    platform: iOS
    sources:
      - OmertaAI
    info:
      path: OmertaAI/Info.plist
      properties:
        CFBundleDisplayName: Omerta AI
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.omerta.assistant
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
