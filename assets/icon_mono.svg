<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- OMERTA AGENT — original blackletter (Old English / gothic textura) capital O.
       Constructed from geometry; not traced from or derived from any typeface. -->
  <defs>
    <linearGradient id="amber" x1="0.15" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#ffe6b0"/>
      <stop offset="38%"  stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#8f5303"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a1610"/>
      <stop offset="100%" stop-color="#060504"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  
  

  <g filter="url(#glow)">
    <!-- body: heavy left/right stems, thin faceted top/bottom joins -->
    <path fill="url(#amber)" fill-rule="evenodd" d="
      M  96 210  L 134 142  L 192 104  L 320 104  L 378 142  L 416 210
      L 416 302  L 378 370  L 320 408  L 192 408  L 134 370  L  96 302 Z
      M 176 222  L 204 176  L 240 156  L 272 156  L 308 176  L 336 222
      L 336 290  L 308 336  L 272 356  L 240 356  L 204 336  L 176 290 Z
    "/>

    <!-- diamond lozenge terminals, top and bottom of the stems -->
    <path fill="url(#amber)" d="M 256  68 L 292 104 L 256 140 L 220 104 Z"/>
    <path fill="url(#amber)" d="M 256 372 L 292 408 L 256 444 L 220 408 Z"/>

    <!-- small lozenge spurs hugging the stems -->
    <path fill="url(#amber)" d="M  74 256 L  96 234 L 118 256 L  96 278 Z"/>
    <path fill="url(#amber)" d="M 394 256 L 416 234 L 438 256 L 416 278 Z"/>

    <!-- angular quill spurs at opposing shoulders -->
    <path fill="url(#amber)" d="M 130 150 L 106 114 L 152 124 Z"/>
    <path fill="url(#amber)" d="M 382 362 L 406 398 L 360 388 Z"/>

    <!-- short hairline flourish inside the counter (does not cross it) -->
    <path fill="url(#amber)" d="M 228 300 L 288 228 L 300 238 L 240 310 Z"/>
    <path fill="url(#amber)" d="M 294 218 L 309 233 L 294 248 L 279 233 Z"/>
  </g>
</svg>
