plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// The version is read from pyproject.toml -- the repo's single source of truth
// -- rather than typed here as a second copy. versionCode is derived from it
// (1.2.0 -> 10200) because Android refuses to install a build whose code is
// lower than the installed one, so it must move exactly when the version does.
def omertaVersion = {
    def f = rootProject.file("../pyproject.toml")
    def m = f.text =~ /(?m)^version\s*=\s*"([^"]+)"/
    if (!m) throw new GradleException("pyproject.toml has no version")
    return m[0][1]
}()
def omertaVersionCode = {
    def n = (omertaVersion =~ /\d+/).collect { it as int }
    while (n.size() < 3) n << 0
    return n[0] * 10000 + n[1] * 100 + n[2]
}()

android {
    namespace 'com.omerta.agent'
    compileSdk 34

    defaultConfig {
        applicationId "com.omerta.agent"
        minSdk 24
        targetSdk 34
        versionCode omertaVersionCode
        versionName omertaVersion

        // Chaquopy: which CPython to embed, and the pure-Python deps the agent
        // backend needs. Both wheels are pure Python (no Rust / native build),
        // so they install cleanly for every ABI. FastAPI/uvicorn are NOT here
        // on purpose — the app uses core/httpd.py (stdlib only).
        python {
            version "3.11"
            pip {
                install "requests"
                install "pyyaml"
            }
        }

        // One .so set per ABI ships a CPython, so each ABI costs real megabytes.
        // The default is the universal set (every real target plus x86_64 for
        // the emulator). Override to slim the APK for one device:
        //   gradle assembleDebug -PomertaAbi=arm64-v8a
        ndk {
            abiFilters(*(project.findProperty("omertaAbi")?.toString()
                ?: "arm64-v8a,armeabi-v7a,x86_64").split(",").collect { it.trim() })
        }
    }

    // Release signing is taken from the environment or a local, untracked
    // keystore.properties — never hardcoded, never committed.
    signingConfigs {
        release {
            def props = new Properties()
            def f = rootProject.file("keystore.properties")
            if (f.exists()) { f.withInputStream { props.load(it) } }
            def ksPath = props.getProperty("storeFile") ?: System.getenv("OMERTA_KEYSTORE")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword props.getProperty("storePassword") ?: System.getenv("OMERTA_STORE_PASS")
                keyAlias      props.getProperty("keyAlias")      ?: System.getenv("OMERTA_KEY_ALIAS")
                keyPassword   props.getProperty("keyPassword")   ?: System.getenv("OMERTA_KEY_PASS")
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            // R8 must not touch the Python payload; keep shrinking off so the
            // Chaquopy runtime and our reflection-called classes stay intact.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            if (rootProject.file("keystore.properties").exists()
                || System.getenv("OMERTA_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The agent's Python code + web UI + skills live in the repo, not in this
    // module. Stage them into an asset dir at build time so there is exactly
    // one source of truth; the app extracts them to filesDir on first launch.
    sourceSets {
        main {
            assets {
                srcDirs += "${layout.buildDirectory.get().asFile}/omerta-assets"
            }
        }
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    packagingOptions { resources { excludes += ['META-INF/*.kotlin_module'] } }

    // libbusybox.so is a BusyBox executable, not a library. Android only lets
    // an app execute files out of the native-library directory, and it only
    // lands there as a real file if it is extracted at install time. AGP 8
    // defaults this to false (libs stay compressed in the APK and are mapped
    // straight from it), which is right for actual libraries and fatal for
    // this one -- the file would simply not exist to exec.
    packaging { jniLibs { useLegacyPackaging = true } }
}

// Copy the single-source agent payload (code + resources) into an asset dir.
// The app ships this inside the APK and extracts it once per version.
// Stamp the build before staging it. An APK has no git checkout and no
// pyproject inside it, so without this the app on the phone cannot tell you
// which build it is -- which is exactly the question you ask when a rebuild
// looks like it did not take. Best-effort: a missing python3 must not fail
// the whole APK build, it just leaves the copy unstamped and honest about it.
tasks.register('stampOmertaBuild', Exec) {
    description = "Write core/build_stamp.json so the APK knows its own build"
    workingDir rootProject.file("..")
    commandLine 'python3', 'scripts/stamp_build.py', 'android'
    ignoreExitValue = true
}

tasks.register('stageOmertaPayload', Copy) {
    dependsOn 'stampOmertaBuild'
    description = "Stage the agent Python payload into assets/omerta_payload"
    def repoRoot = rootProject.file("..")
    into layout.buildDirectory.dir("omerta-assets/omerta_payload")
    from(repoRoot) {
        include 'core/**', 'tools/**', 'webui/**', 'assets/**',
                'skills/**', 'plugins/**',
                'persona.yaml', 'connectors.yaml', 'omerta_android.py'
        exclude '**/__pycache__/**', '**/*.pyc'
    }
}

// The asset dir above is a plain path, so Gradle cannot tell who produces it
// and every consumer has to say so itself. Assets are merged AND read by lint
// (lintVitalAnalyzeRelease is what caught this), so both are named here. If a
// future AGP adds another consumer this list needs it too -- the symptom is a
// build failure naming the task, not a silently empty payload.
tasks.matching {
    (it.name.startsWith('merge') && it.name.endsWith('Assets')) ||
    it.name.startsWith('lint') ||
    (it.name.startsWith('generate') && it.name.contains('Lint'))
}.configureEach { dependsOn 'stageOmertaPayload' }

dependencies { }
