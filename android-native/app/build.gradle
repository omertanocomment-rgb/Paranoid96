plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.omerta.agent'
    compileSdk 34

    defaultConfig {
        applicationId "com.omerta.agent"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        // Chaquopy: which CPython to embed, and the pure-Python deps the agent
        // backend needs. Both wheels are pure Python (no Rust / native build),
        // so they install cleanly for every ABI. FastAPI/uvicorn are NOT here
        // on purpose — the app uses core/httpd.py (stdlib only).
        python {
            version "3.11"
            pip {
                install "requests"
                install "pyyaml"
            }
        }

        // One .so set per ABI ships a CPython, so keep the list to real
        // targets plus x86_64 for the emulator.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    // Release signing is taken from the environment or a local, untracked
    // keystore.properties — never hardcoded, never committed.
    signingConfigs {
        release {
            def props = new Properties()
            def f = rootProject.file("keystore.properties")
            if (f.exists()) { f.withInputStream { props.load(it) } }
            def ksPath = props.getProperty("storeFile") ?: System.getenv("OMERTA_KEYSTORE")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword props.getProperty("storePassword") ?: System.getenv("OMERTA_STORE_PASS")
                keyAlias      props.getProperty("keyAlias")      ?: System.getenv("OMERTA_KEY_ALIAS")
                keyPassword   props.getProperty("keyPassword")   ?: System.getenv("OMERTA_KEY_PASS")
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            // R8 must not touch the Python payload; keep shrinking off so the
            // Chaquopy runtime and our reflection-called classes stay intact.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            if (rootProject.file("keystore.properties").exists()
                || System.getenv("OMERTA_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The agent's Python code + web UI + skills live in the repo, not in this
    // module. Stage them into an asset dir at build time so there is exactly
    // one source of truth; the app extracts them to filesDir on first launch.
    sourceSets {
        main {
            assets {
                srcDirs += "${layout.buildDirectory.get().asFile}/omerta-assets"
            }
        }
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    packagingOptions { resources { excludes += ['META-INF/*.kotlin_module'] } }
}

// Copy the single-source agent payload (code + resources) into an asset dir.
// The app ships this inside the APK and extracts it once per version.
tasks.register('stageOmertaPayload', Copy) {
    description = "Stage the agent Python payload into assets/omerta_payload"
    def repoRoot = rootProject.file("..")
    into layout.buildDirectory.dir("omerta-assets/omerta_payload")
    from(repoRoot) {
        include 'core/**', 'tools/**', 'webui/**', 'assets/**',
                'skills/**', 'plugins/**',
                'persona.yaml', 'connectors.yaml', 'omerta_android.py'
        exclude '**/__pycache__/**', '**/*.pyc'
    }
}

// Make sure the payload is staged before assets are merged, for every variant.
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }
     .configureEach { dependsOn 'stageOmertaPayload' }

dependencies { }
