name: Omerta AI Desktop (Linux)

on:
  push:
    branches: ["**"]
    paths: ["desktop/**", "brain/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "brain/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Headless tests
        run: |
          python3 -m unittest brain/test_omerta_brain.py
          python3 -m unittest desktop/test_desktop.py
          python3 desktop/omerta_desktop.py --selftest
      - name: Generate brand icons
        run: python3 design/logo/gen_icons.py
      - name: Build .deb (native, installs on Linux Mint/Ubuntu)
        run: bash desktop/packaging/build-deb.sh
      - name: Build self-contained binary + AppImage
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk
          pip install pyinstaller
          bash desktop/packaging/build-appimage.sh || bash desktop/packaging/build-binary.sh
      - uses: actions/upload-artifact@v4
        with:
          name: omerta-ai-desktop-linux
          path: |
            desktop/dist/*.deb
            desktop/dist/*.AppImage
            desktop/dist/omerta-ai

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Headless tests
        run: |
          python3 -m unittest desktop/test_desktop.py
          python3 desktop/omerta_desktop.py --selftest
      - name: Generate brand icons
        run: python3 design/logo/gen_icons.py
      - name: Build self-contained .exe (signed if a cert is provided)
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: |
          pip install pyinstaller
          ./desktop/packaging/build-exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: omerta-ai-desktop-windows
          path: desktop/dist/OmertaAI.exe
