name: Build OMERTA AI Engine (deb / exe / AppImage)

on:
  push:
    branches: ["**"]
    paths: ["engine/**", ".github/workflows/engine-build.yml"]
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build binary + .deb
        run: |
          bash packaging/pyinstaller/build-binary.sh
          bash packaging/deb/build-deb.sh
      - name: Build AppImage
        run: |
          sudo apt-get update && sudo apt-get install -y libfuse2 || true
          bash packaging/appimage/build-appimage.sh || echo "AppImage build reported an issue"
      - uses: actions/upload-artifact@v4
        with:
          name: omerta-engine-linux
          path: |
            engine/dist/*.deb
            engine/dist/*.AppImage
            engine/dist/omerta
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build omerta.exe
        run: pyinstaller --onefile --clean --noconfirm --name omerta --paths . --collect-submodules omerta packaging/pyinstaller/omerta_entry.py
      - name: Smoke test
        run: dist\omerta.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: omerta-engine-windows-exe
          path: engine/dist/omerta.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build macOS binary
        run: pyinstaller --onefile --clean --noconfirm --name omerta --paths . --collect-submodules omerta packaging/pyinstaller/omerta_entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: omerta-engine-macos
          path: engine/dist/omerta
          if-no-files-found: error
