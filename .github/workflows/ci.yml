name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: safety + integration suites
        run: bash tests/run_all.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install build twine
      - name: build wheel
        run: |
          bash scripts/_stage_package.sh
          cd build_pkg && python -m build
      - name: validate distribution metadata
        run: twine check build_pkg/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: build_pkg/dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: build release apk
        env:
          OMERTA_KEYSTORE: ${{ secrets.OMERTA_KEYSTORE_PATH }}
          OMERTA_STORE_PASS: ${{ secrets.OMERTA_STORE_PASS }}
          OMERTA_KEY_ALIAS: ${{ secrets.OMERTA_KEY_ALIAS }}
          OMERTA_KEY_PASS: ${{ secrets.OMERTA_KEY_PASS }}
        run: cd android-native && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: android-native/app/build/outputs/apk/**/*.apk }

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
