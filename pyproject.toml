[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omerta-agent"
version = "1.0.0"
description = "Offline-capable coding & firmware agent that asks before every action"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "OMERTA"}]
keywords = ["agent", "llm", "offline", "firmware", "android", "termux"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "requests>=2.31.0,<3",
  "pyyaml>=6.0,<7",
  "rich>=13.7.0,<15",
]

[project.optional-dependencies]
web = ["fastapi>=0.111.0,<1", "uvicorn>=0.30.0,<1", "websockets>=12.0,<16"]
# The Anthropic SDK is OPTIONAL — core/providers/anthropic_p.py falls back to
# plain requests. Installing it on Termux pulls pydantic-core, which needs a
# Rust toolchain. Do not add it to `all` for that reason.
claude = ["anthropic>=0.40.0,<1"]
all = ["fastapi>=0.111.0,<1", "uvicorn>=0.30.0,<1", "websockets>=12.0,<16"]

[project.scripts]
omerta = "omerta_agent.__main__:main"
omerta-agent = "omerta_agent.__main__:main"

[project.urls]
Documentation = "https://github.com/omertanocomment-rgb/omerta-agent"

[tool.setuptools]
packages = ["omerta_agent", "omerta_agent.core", "omerta_agent.core.providers",
            "omerta_agent.tools"]
include-package-data = true

[tool.setuptools.package-data]
omerta_agent = ["persona.yaml", "connectors.yaml", "webui/*", "assets/*",
                "skills/*/SKILL.md", "plugins/*.py", "plugins/*/*"]
