<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OMERTA AGENT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
:root{--bg:#0b0a08;--panel:#141210;--border:#2a2620;--amber:#ffb020;--text:#e8ddc8;--muted:#8a8272}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;
 height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:420px;width:100%}
img{width:86px;display:block;margin:0 auto 18px}
h1{color:var(--amber);font-size:1.05rem;letter-spacing:.1em;text-align:center;margin:0 0 6px}
p{color:var(--muted);font-size:.82rem;line-height:1.55;text-align:center;margin:0 0 20px}
label{font-size:.7rem;color:var(--muted);letter-spacing:.08em;display:block;margin:14px 0 5px}
input{width:100%;background:#000;border:1px solid var(--border);color:var(--text);
 padding:13px;border-radius:8px;font-family:inherit;font-size:.9rem}
button{width:100%;margin-top:16px;background:var(--amber);color:#000;border:none;
 padding:15px;border-radius:8px;font-weight:700;font-family:inherit;font-size:.9rem}
.hint{font-size:.68rem;color:var(--muted);margin-top:14px;line-height:1.5;
 border-top:1px solid var(--border);padding-top:14px}
code{color:var(--amber)}
</style>
</head>
<body>
<div class="card">
  <img src="icon.svg" alt="O">
  <h1>OMERTA AGENT</h1>
  <p>Connect to your agent backend.<br>Runs on this phone (Termux) or any machine on your network.</p>
  <label>BACKEND ADDRESS</label>
  <input id="host" placeholder="127.0.0.1:8787" value="127.0.0.1:8787">
  <label>ACCESS TOKEN</label>
  <input id="token" placeholder="printed in the server console">
  <button onclick="go()">CONNECT</button>
  <div class="hint">
    On this phone: run <code>python server.py</code> in Termux and keep
    <code>127.0.0.1:8787</code>. Loopback needs no token.<br><br>
    Remote machine: use its LAN IP and paste the token the server printed.
  </div>
</div>
<script>
const H='omerta_host', T='omerta_token';
try{
  if(localStorage.getItem(H)) document.getElementById('host').value=localStorage.getItem(H);
  if(localStorage.getItem(T)) document.getElementById('token').value=localStorage.getItem(T);
}catch(e){}
function go(){
  const h=document.getElementById('host').value.trim().replace(/^https?:\/\//,'');
  const t=document.getElementById('token').value.trim();
  if(!h) return;
  try{ localStorage.setItem(H,h); localStorage.setItem(T,t); }catch(e){}
  location.href=`http://${h}/${t?('?token='+encodeURIComponent(t)):''}`;
}
document.getElementById('token').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
// auto-connect if we already know where to go
try{ if(localStorage.getItem(H)) setTimeout(()=>{ if(!document.hidden) go(); }, 1200); }catch(e){}
</script>
</body>
</html>
